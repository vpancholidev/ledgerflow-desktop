name: Zero-Touch Auto-Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Auto-bump version
        id: bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: auto-bump version to %s [skip ci]"
          git push origin master --follow-tags
          $VERSION = node -p "require('./package.json').version"
          echo "NEW_APP_VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build React Interface
        run: npm run build:vite

      - name: Build Electron Exe & Push Release natively
        run: npx electron-builder --win --x64 -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}